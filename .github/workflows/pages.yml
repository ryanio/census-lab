name: Publish Census
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest -v
      - run: python3 pages.py "$RUNNER_TEMP/census-site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/census-site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the shared site
        id: deployment
        uses: actions/deploy-pages@v4
